<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  <link href="assets/css/index.css" rel="stylesheet"></head>

  <body class="relative min-h-screen">
    <!-- Time and Network bar starts -->
    <div class="mx-auto max-w-md">
      <div class="container">
        <div class="flex justify-between items-center py-2">
          <img
            class="w-full"
            src="assets/images/statusbar.png"
            alt=""
            draggable="false" />
        </div>
      </div>
    </div>
    <!-- Time and Network bar ends -->
    <section class="mx-auto max-w-md">
      <div class="container">
        <div
          class="p-4 flex items-center justify-between border-b border-gr30 mb-4">
          <a href="index.html" class="flex items-center gap-3">
            <span class="d-center"
              ><i class="hgi hgi-stroke hgi-arrow-left-01 text-2xl"></i
            ></span>
            <span class="fs-six text-gr80 font-bold">Manage Address</span>
          </a>
          <a href="cart_style.html" class="d-center">
            <i
              class="hgi hgi-stroke hgi-shopping-cart-02 text-gr80 text-2xl"></i>
          </a>
        </div>
      </div>
    </section>
    <!-- Products Delete Starts -->
    <section class="mx-auto max-w-md px-4 mb-4">
      <div class="border border-gr30 rounded-xl mb-4">
        <div class="flexb px-4 py-[10px] bg-gr10 mb-3 border-b border-gr30">
          <div class="flexs gap-2">
            <span class="d-center">
              <i class="hgi hgi-stroke hgi-home-01 text-xl text-gr80"></i>
            </span>
            <span class="text-gr80 font-bold">Home Address</span>
          </div>
          <button>
            <i class="hgi hgi-stroke hgi-edit-02 text-2xl"></i>
          </button>
        </div>
        <div class="mb-4 px-4">
          <p class="text-sm text-gr80">
            8502 Preston Rd. Inglewood, Maine <br />
            98380, USA
          </p>
        </div>
      </div>
      <div class="border border-gr30 rounded-xl mb-80">
        <div class="flexb px-4 py-[10px] bg-gr10 mb-3 border-b border-gr30">
          <div class="flexs gap-2">
            <span class="d-center">
              <i class="hgi hgi-stroke hgi-building-03 text-xl text-gr80"></i>
            </span>
            <span class="text-gr80 font-bold">Office Address</span>
          </div>
          <button>
            <i class="hgi hgi-stroke hgi-edit-02 text-2xl"></i>
          </button>
        </div>
        <div class="mb-4 px-4">
          <p class="text-sm text-gr80">
            8502 Preston Rd. Inglewood, Maine <br />
            98380, USA
          </p>
        </div>
      </div>
      <div class="p-4 border-t border-gr30">
        <a href="settings.html"
          class="text-sm font-bold text-nt10 bg-primary py-3 px-4 rounded-lg w-full block text-center">
          Save Now
        </a>
      </div>
    </section>
    <!-- Products Delete  Ends -->

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  <script defer src="index.js"></script></body>
</html>
