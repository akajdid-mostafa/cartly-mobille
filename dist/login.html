<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  <link href="assets/css/index.css" rel="stylesheet"></head>

  <body>
    <!-- Time and Network bar starts -->
    <div class="mx-auto max-w-md pb-14">
      <div class="container">
        <div class="flex justify-between items-center py-2">
          <img
            class="w-full"
            src="assets/images/statusbar.png"
            alt=""
            draggable="false" />
        </div>
      </div>
    </div>
    <!-- Time and Network bar ends -->
    <section class="mx-auto max-w-md">
      <div class="container">
        <div>
          <div class="mb-6">
            <img class="mx-auto" src="assets/images/login-thumb.png" alt="" />
          </div>
          <div class="mb-8 text-center">
            <h5 class="mb-2 text-gr80 font-bold">Log in to your account</h5>
            <p class="text-gr60">Welcome back! Please enter your details.</p>
          </div>
          <div class="px-4">
            <form>
              <div class="relative mb-5">
                <label
                  class="block text-gray text-[12px] absolute top-[-13px] left-4 bg-gr20 px-1"
                  for="email"
                  >Email Address</label
                >
                <input
                  class="w-full rounded-[8px] px-4 py-3 text-gr80 placeholder:text-gr80"
                  type="email"
                  id="email"
                  placeholder="Lora.xa@xample.com" />
              </div>
              <div class="relative mb-6">
                <label
                  class="block text-gray text-[12px] absolute top-[-13px] left-4 bg-gr20 px-1"
                  for="password"
                  >Password</label
                >
                <input
                  class="w-full rounded-[8px] px-4 py-3 text-gr80 placeholder:text-gr80"
                  type="password"
                  id="password"
                  placeholder="********************" />
              </div>
              <div class="flex justify-between items-center mb-6">
                <div class="flex items-center">
                  <input
                    id="remember"
                    type="checkbox"
                    class="accent-gr80 w-4 h-4 rounded focus:ring-0" />
                  <label
                    for="remember"
                    class="ml-2 text-gr80 text-sm cursor-pointer text-nowrap">
                    Remember me
                  </label>
                </div>
                <div>
                  <a
                    class="text-primary text-sm font-bold"
                    href="forget_password.html"
                    >Forgot password</a
                  >
                </div>
              </div>
              <div
                class="w-full px-6 py-3 rounded-[8px] bg-primary hover:bg-p20 duration-300 mb-4">
                <a href="index.html" type="submit" class="text-nt10 font-bold w-full text-center block">
                  Get Started!
                </a>
              </div>
              <div class="w-full text-center mb-8">
                <a
                  href="onboarding2.html"
                  class="py-3 px-6 rounded-[8px] bg-transparent text-gr80 font-bold w-full block hover:bg-p20 duration-300 border border-gr80"
                  >Sign in with Google</a
                >
              </div>
            </form>
            <div class="flex items-center justify-center gap-1 mb-9">
              <span>Don’t have an account?</span>
              <a
                class="font-bold text-sm text-primary"
                href="signup.html"
                >Sign up</a
              >
            </div>
          </div>
        </div>
        <div class="text-center flex justify-center pt-5 pb-3 px-4">
          <span class="h-1 w-[134px] rounded-full bg-gr60"></span>
        </div>
      </div>
    </section>

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  <script defer src="index.js"></script></body>
</html>
