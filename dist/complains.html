<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  <link href="assets/css/index.css" rel="stylesheet"></head>

  <body class="relative min-h-screen">
    <!-- Time and Network bar starts -->
    <div class="mx-auto max-w-md">
      <div class="container">
        <div class="flex justify-between items-center py-2">
          <img
            class="w-full"
            src="assets/images/statusbar.png"
            alt=""
            draggable="false" />
        </div>
      </div>
    </div>
    <!-- Time and Network bar ends -->
    <section class="mx-auto max-w-md mb-5">
      <div class="container">
        <div
          class="p-4 flex items-center justify-between border-b border-gr30 mb-4">
          <a href="index.html" class="flex items-center gap-3">
            <span class="d-center"
              ><i class="hgi hgi-stroke hgi-arrow-left-01 text-2xl"></i
            ></span>
            <span class="fs-six text-gr80 font-bold">Complains</span>
          </a>
        </div>
      </div>
    </section>
    <!-- Products Delete Starts -->
    <section class="mx-auto max-w-md px-4">
      <form>
        <div class="mb-[50px]">
          <div class="mb-6">
            <img
              class="mx-auto"
              src="assets/images/compplainsimg.png"
              alt="" />
          </div>
          <span class="font-bold text-gr80 text-center mb-4"
            >How can we help you ?</span
          >
          <p class="text-gr60 text-center mb-3">
            It seems like you're experiencing some issues with our system. Don't
            worry—we're here to assist you!
          </p>
          <div class="p-4 border border-gr30 rounded-xl">
            <input
              type="text"
              placeholder="Subject"
              class="w-full p-4 !border !border-gr30 rounded-lg mb-4" />
            <input
              type="text"
              placeholder="Email"
              class="w-full p-4 !border !border-gr30 rounded-lg mb-4" />
            <textarea
              cols="10"
              rows="5"
              placeholder="Write a Review"
              class="w-full p-4 !border !border-gr30 rounded-lg"></textarea>
          </div>
        </div>
        <div class="p-4 mt-5 border-t border-gr30">
          <a href="index.html"
            class="font-bold text-nt10 py-3 w-full rounded-lg bg-primary text-center block">
            Submit
          </a>
        </div>
      </form>
    </section>
    <!-- Products Delete  Ends -->

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  <script defer src="index.js"></script></body>
</html>
