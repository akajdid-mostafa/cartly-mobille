<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  <link href="assets/css/index.css" rel="stylesheet"></head>

  <body class="relative min-h-screen">
    <!-- Time and Network bar starts -->
    <div class="mx-auto max-w-md">
      <div class="container">
        <div class="flex justify-between items-center py-2">
          <img
            class="w-full"
            src="assets/images/statusbar.png"
            alt=""
            draggable="false" />
        </div>
      </div>
    </div>
    <!-- Time and Network bar ends -->
    <section class="mx-auto max-w-md">
      <div class="container">
        <div
          class="p-4 flex items-center justify-between border-b border-gr30 mb-4">
          <a href="index.html" class="flex items-center gap-3">
            <span class="d-center"
              ><i class="hgi hgi-stroke hgi-arrow-left-01 text-2xl"></i
            ></span>
            <span class="fs-six text-gr80 font-bold">Profile</span>
          </a>
        </div>
      </div>
    </section>
    <section class="mx-auto max-w-md px-4">
      <form>
        <div class="p-4 rounded-xl border border-gr30 mb-4">
          <div class="py-3 px-[14px] rounded-lg border border-gr30 mb-4">
            <input
              type="text"
              placeholder="First Name"
              class="!p-0 !border-0" />
          </div>
          <div class="py-3 px-[14px] rounded-lg border border-gr30 mb-4">
            <input type="text" placeholder="Last Name" class="!p-0 !border-0" />
          </div>
          <div class="py-3 px-[14px] rounded-lg border border-gr30 mb-4">
            <input type="number" placeholder="Phone" class="!p-0 !border-0" />
          </div>
          <div class="py-3 px-[14px] rounded-lg border border-gr30 mb-4">
            <input
              type="text"
              placeholder="Email Address"
              class="!p-0 !border-0" />
          </div>
          <div
            class="py-3 px-[14px] rounded-lg border border-gr30 !text-gr60 mb-4">
            <select class="!p-0 !border-0 w-full !outline-none">
              <option value="" selected disabled hidden>Country</option>
              <option value="1">Afghanistan</option>
              <option value="2">Albania</option>
              <option value="3">Algeria</option>
              <option value="4">Angola</option>
              <option value="5">Antigua and Barbuda</option>
              <option value="6">Argentina</option>
              <option value="7">Armenia</option>
              <option value="8">Australia</option>
              <option value="9">Austria</option>
              <option value="10">Azerbaijan</option>
            </select>
          </div>
          <div
            class="py-3 px-[14px] rounded-lg border border-gr30 !text-gr60 mb-4">
            <select class="!p-0 !border-0 w-full !outline-none">
              <option value="" selected disabled hidden>City</option>
              <option value="1">New York</option>
              <option value="2">Los Angeles</option>
              <option value="3">Chicago</option>
              <option value="4">Houston</option>
              <option value="5">Philadelphia</option>
              <option value="6">Phoenix</option>
              <option value="7">San Antonio</option>
              <option value="8">San Diego</option>
              <option value="9">Dallas</option>
              <option value="10">San Jose</option>
            </select>
          </div>
          <div
            class="py-3 px-[14px] rounded-lg border border-gr30 !text-gr60 mb-4">
            <select class="!p-0 !border-0 w-full !outline-none">
              <option value="" selected disabled hidden>Area</option>
              <option value="1">San Antonio</option>
              <option value="2">Philadelphia</option>
            </select>
          </div>
          <div
            class="py-3 px-[14px] rounded-lg border border-gr30 !text-gr60 mb-4">
            <select class="!p-0 !border-0 w-full !outline-none">
              <option value="" selected disabled hidden>Zip Code</option>
              <option value="1">10001</option>
              <option value="2">10002</option>
              <option value="3">10003</option>
              <option value="4">10004</option>
              <option value="5">10005</option>
              <option value="6">10006</option>
              <option value="7">10007</option>
              <option value="8">10008</option>
              <option value="9">10009</option>
              <option value="10">10010</option>
            </select>
          </div>
          <div class="py-3 px-[14px] rounded-lg border border-gr30 mb-4">
            <input type="text" placeholder="Address" class="!p-0 !border-0" />
          </div>
          <div>
            <span class="text-gr80 font-semibold mb-4"
              >Choose Address Type</span
            >
            <div class="flexs gap-2 mb-4">
              <a
                href="javascript:void(0)"
                class="flexs py-[6px] px-4 gap-2 rounded-lg bg-sc20">
                <span class="d-center">
                  <i class="hgi hgi-stroke hgi-home-01 text-xl text-gr80"></i>
                </span>
                <span class="text-gr80 font-medium">Home</span>
              </a>
              <a
                href="javascript:void(0)"
                class="flexs py-[6px] px-4 gap-2 rounded-lg bg-gr30">
                <span class="d-center">
                  <i
                    class="hgi hgi-stroke hgi-building-03 text-xl text-gr80"></i>
                </span>
                <span class="text-gr80 font-medium">Office</span>
              </a>
              <a
                href="javascript:void(0)"
                class="flexs py-[6px] px-4 gap-2 rounded-lg bg-gr30">
                <span class="d-center">
                  <i
                    class="hgi hgi-stroke hgi-burj-al-arab text-xl text-gr80"></i>
                </span>
                <span class="text-gr80 font-medium">City</span>
              </a>
            </div>
            <div class="flex items-center gap-3">
              <input type="checkbox" class="!size-[14px]" />
              <span class="text-left block text-gr80 text-sm"
                >Set Default Address</span
              >
            </div>
          </div>
        </div>
        <div class="p-4 border-t border-gr30">
          <button
            class="text-sm font-bold text-nt10 bg-primary py-3 px-4 rounded-lg w-full">
            Save Now
          </button>
        </div>
      </form>
    </section>

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  <script defer src="index.js"></script></body>
</html>
