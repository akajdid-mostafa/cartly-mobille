<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  <link href="assets/css/index.css" rel="stylesheet"></head>

  <body class="relative min-h-screen">
    <!-- Time and Network bar starts -->
    <div class="mx-auto max-w-md">
      <div class="container">
        <div class="flex justify-between items-center py-2">
          <img
            class="w-full"
            src="assets/images/statusbar.png"
            alt=""
            draggable="false" />
        </div>
      </div>
    </div>
    <!-- Time and Network bar ends -->
    <section class="mx-auto max-w-md">
      <div class="container">
        <div class="p-4 flex items-center justify-between border-b border-gr30">
          <div class="flex items-center gap-3">
            <span class="d-center cursor-pointer"
              ><i class="hgi hgi-stroke hgi-arrow-left-01 text-2xl"></i
            ></span>
            <div>
              <span class="fs-six text-gr80 font-bold"
                >Puma official store</span
              >
              <div class="flex items-center gap-2">
                <div class="flex items-center gap-1">
                  <img src="assets/images/verified.png" alt="" />
                  <span class="text-gr60 text-xs">Authorize store</span>
                </div>
                <span class="h-[10px] w-[1px] bg-gray"></span>
                <div class="flex items-center gap-1">
                  <span class="size-[10px] rounded-full bg-primary"></span>
                  <span class="text-gr60 text-xs">Online</span>
                </div>
                <span class="h-[10px] w-[1px] bg-gray"></span>
                <div class="flex items-center gap-1">
                  <i class="hgi hgi-stroke hgi-user text-xs text-gr60"></i>
                  <span class="text-gr60 text-xs">12k+ flowing</span>
                </div>
              </div>
            </div>
          </div>
          <a href="javascript:void(0)"
            ><i class="hgi hgi-stroke hgi-gift text-gr80 text-2xl"></i
          ></a>
        </div>
      </div>
    </section>
    <!-- Bold Elegant Dress Starts -->
    <section class="mx-auto max-w-md">
      <div class="px-4 pt-4">
        <div class="flex items-center gap-2">
          <span class="w-full h-[1px] bg-gr30"></span>
          <span class="text-sm text-gr80">Today</span>
          <span class="w-full h-[1px] bg-gr30"></span>
        </div>
        <div class="flex gap-3 mb-4 pe-5">
          <div class="w-10">
            <img class="w-fit" src="assets/images/directly5.png" alt="" />
          </div>
          <div>
            <span class="text-sm font-bold text-gr80 mb-[6px]">Pumma</span>
            <div
              class="px-[14px] py-[10px] rounded-b-lg rounded-tr-lg bg-sc10 mb-[6px]">
              <p class="text-gr80">
                Hey team, I’ve finished with the requirements doc!
              </p>
            </div>
            <span class="text-xs text-gray">12:89 PM</span>
          </div>
        </div>
        <div class="flex gap-3 pe-5">
          <div class="w-10">
            <img class="w-fit" src="assets/images/directly5.png" alt="" />
          </div>
          <div>
            <span class="text-sm font-bold text-gr80 mb-[6px]">Pumma</span>
            <div
              class="px-[14px] py-[10px] rounded-b-lg rounded-tr-lg bg-sc10 mb-[6px]">
              <p class="text-gr80">
                Hey team, I’ve finished with the requirements doc!
              </p>
            </div>
            <span class="text-xs text-gray">12:89 PM</span>
          </div>
        </div>
        <div class="mb-2 ps-6">
          <div class="flex justify-end mb-[6px]">
            <p
              class="text-nt10 px-[14px] py-[10px] rounded-b-lg rounded-tl-lg border border-gr30 bg-primary inline-block">
              Awesome! Thanks.
            </p>
          </div>
          <div class="flex items-center justify-end gap-1">
            <span class="text-xs text-gray">12:89 PM</span>
            <i
              class="hgi hgi-stroke hgi-tick-double-01 text-primary text-base"></i>
          </div>
        </div>
        <div class="flex gap-3 mb-20 pe-5">
          <div class="w-10">
            <img class="w-fit" src="assets/images/directly5.png" alt="" />
          </div>
          <div>
            <span class="text-sm font-bold text-gr80 mb-[6px]">Pumma</span>
            <div
              class="px-[14px] py-[10px] rounded-b-lg rounded-tr-lg bg-sc10 mb-[6px]">
              <p class="text-gr80">
                Hey team, I’ve finished with the requirements doc!
              </p>
            </div>
            <span class="text-xs text-gray">12:89 PM</span>
          </div>
        </div>
        <div class="flex items-center gap-4 py-[10px] px-4 bg-gr10">
          <span class="cursor-pointer d-center"
            ><i class="hgi hgi-stroke hgi-camera-01 text-2xl text-gr60"></i
          ></span>
          <div
            class="w-full flex items-center py-2 px-[14px] border border-[#919EAB52] rounded-lg">
            <input type="text" class="!border-0 !p-0" placeholder="Type here" />
            <span class="cursor-pointer d-center"
              ><i class="hgi hgi-stroke hgi-smile text-2xl text-gr60"></i
            ></span>
          </div>
          <span class="cursor-pointer d-center"
            ><i class="hgi hgi-stroke hgi-mic-01 text-2xl text-gr60"></i
          ></span>
        </div>
      </div>
    </section>
    <!-- Bold Elegant Dress Ends -->

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  <script defer src="index.js"></script></body>
</html>
