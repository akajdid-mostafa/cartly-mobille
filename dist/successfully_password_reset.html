<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  <link href="assets/css/index.css" rel="stylesheet"></head>

  <body class="bg-gr20">
    <!-- Time and Network bar starts -->
    <div class="mx-auto max-w-md bg-gr20 mb-[180px]">
      <div class="container">
        <div class="flex justify-between items-center py-2">
          <img
            class="w-full"
            src="assets/images/statusbar.png"
            alt=""
            draggable="false" />
        </div>
      </div>
    </div>
    <!-- Time and Network bar ends -->
    <section class="mx-auto max-w-md bg-gr20">
      <div class="container">
        <div>
          <div class="mb-6">
            <img
              class="mx-auto"
              src="assets/images/successfully-password-rest.png"
              alt="" />
          </div>
          <div class="mb-8 text-center">
            <h5 class="mb-2 text-gr80 font-bold">
              Successfully Password Reset
            </h5>
            <p class="text-gr60">
              Your password has been successfully reset. <br />
              Click below to log in magically.
            </p>
          </div>
          <div class="px-4">
            <div>
              <a
                class="flex items-center justify-center gap-2"
                href="login.html">
                <span class="d-center"
                  ><i class="hgi hgi-stroke hgi-arrow-left-02"></i
                ></span>
                <span class="font-bold text-gr80">Back to Login</span></a
              >
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  <script defer src="index.js"></script></body>
</html>
