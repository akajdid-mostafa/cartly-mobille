<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  <link href="assets/css/index.css" rel="stylesheet"></head>

  <body class="relative min-h-screen">
    <main class="liveshoppingstyle2 mx-auto max-w-md">
      <!-- Time and Network bar starts -->
      <div class="mx-auto max-w-md">
        <div class="container">
          <div class="flex justify-between items-center py-2">
            <img
              class="w-full"
              src="assets/images/statusbar.png"
              alt=""
              draggable="false" />
          </div>
        </div>
      </div>
      <div class="px-4 flex items-center justify-between gap-2 mb-[140px]">
        <div class="flex items-center gap-4">
          <img
            class="rounded-full size-10"
            src="assets/images/sellerlogo7.png"
            alt="" />
          <a href="seller_profile.html">
            <span class="text-sm font-bold text-gr80 cursor-pointer"
              >Pumma Shop</span
            >
            <span class="text-xs text-gr60">Just be your self</span>
          </a>
        </div>
        <div class="flex items-center gap-2">
          <div class="flex items-center gap-2">
            <i class="hgi hgi-stroke hgi-view text-xl text-nt10"></i>
            <span class="text-xs text-nt10">1.5K</span>
          </div>
          <span
            class="text-xs text-nt10 px-2 py-1 bg-error rounded-full inline-block"
            >Live</span
          >
        </div>
      </div>
      <div class="px-4 mb-4">
        <div class="flex flex-col items-end mb-3">
          <a href="seller_profile.html" class="!relative mb-2">
            <img
              class="border border-error rounded-full"
              src="assets/images/sellerlogo7.png"
              alt="Image" />
            <span
              class="d-center size-[18px] rounded-full bg-error absolute bottom-0 right-0"
              ><i
                class="hgi hgi-stroke hgi-internet-antenna-01 text-[12px] text-nt10"></i
            ></span>
          </a>
          <a
            href="seller_profile.html"
            class="text-[12px] text-nt30 text-center block"
            >Pumma</a
          >
        </div>
        <div class="flex flex-col items-end mb-3">
          <button class="size-[48px] bg-nt10 rounded-full d-center">
            <i class="hgi hgi-stroke hgi-thumbs-up text-2xl"></i>
          </button>
        </div>
        <div class="flex flex-col items-end mb-3">
          <button class="size-[48px] bg-nt10 rounded-full d-center">
            <i class="hgi hgi-stroke hgi-comment-01 text-2xl"></i>
          </button>
        </div>
        <div class="flex flex-col items-end">
          <a href="cart_style.html" class="size-[48px] bg-nt10 rounded-full relative d-center">
            <i class="hgi hgi-stroke hgi-shopping-cart-02 text-2xl"></i>
            <span
              class="size-4 d-center bg-primary rounded-full text-[10px] text-nt10 absolute top-1/6 left-3/6"
              >5</span
            >
          </a>
        </div>
      </div>
      <div class="px-4">
        <div
          class="flex items-start gap-1 p-2 rounded-xl bg-[rgba(145,158,171,0.08)] w-1/2 mb-1">
          <img class="size-6" src="assets/images/liveshoppins1.png" alt="" />
          <div>
            <span class="text-xs text-nt10 cursor-pointer">Devon Lane</span>
            <span class="text-[10px] text-nt10">Just be your self</span>
          </div>
        </div>
        <div
          class="flex items-start gap-1 p-2 rounded-xl bg-[rgba(145,158,171,0.08)] w-1/2 mb-1">
          <img class="size-6" src="assets/images/liveshoppins2.png" alt="" />
          <div>
            <span class="text-xs text-nt10 cursor-pointer">Lora Andy</span>
            <span class="text-[10px] text-nt10"
              >How about your yesterday product ?</span
            >
          </div>
        </div>
        <div
          class="flex items-start gap-1 p-2 rounded-xl bg-[rgba(145,158,171,0.08)] w-1/2 mb-1">
          <img class="size-6" src="assets/images/liveshoppins3.png" alt="" />
          <div>
            <span class="text-xs text-nt10 cursor-pointer">Guy Hawkins</span>
            <span class="text-[10px] text-nt10">Hello, I need black one </span>
          </div>
        </div>
        <div
          class="flex items-start gap-1 p-2 rounded-xl bg-[rgba(145,158,171,0.08)] w-1/2 mb-[14px]">
          <img class="size-6" src="assets/images/liveshoppins4.png" alt="" />
          <div>
            <span class="text-xs text-nt10 cursor-pointer">Jenny Wilson</span>
            <span class="text-[10px] text-nt10">Hello, I need black one </span>
          </div>
        </div>
        <div class="pb-6">
          <a
            href="live_shopping3.html"
            class="py-2 px-6 bg-success rounded-lg flex items-center justify-center gap-2 cursor-pointer">
            <span class="d-center"
              ><i
                class="hgi hgi-stroke hgi-internet-antenna-01 text-2xl text-gr80"></i
            ></span>
            <span class="font-bold text-gr80"
              >Click to enter the live broadcast</span
            >
          </a>
        </div>
      </div>
    </main>

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  <script defer src="index.js"></script></body>
</html>
