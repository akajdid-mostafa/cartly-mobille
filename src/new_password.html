<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  </head>

  <body>
    <!-- Time and Network bar starts -->
    <div class="mx-auto max-w-md pb-14">
      <div class="container">
        <div class="flex justify-between items-center py-2">
          <img
            class="w-full"
            src="assets/images/statusbar.png"
            alt=""
            draggable="false" />
        </div>
      </div>
    </div>
    <!-- Time and Network bar ends -->
    <section class="mx-auto max-w-md">
      <div class="container">
        <div>
          <div class="mb-6">
            <img
              class="mx-auto"
              src="assets/images/setnewpassword.png"
              alt="" />
          </div>
          <div class="mb-8 text-center">
            <h5 class="mb-2 text-gr80 font-bold">Set new password</h5>
            <p class="text-gr60">
              Your new password must be different to <br />
              previously used passwords.
            </p>
          </div>
          <div class="px-4">
            <form class="mb-8">
              <div class="relative mb-5">
                <label
                  class="block text-gray text-[12px] absolute top-[-13px] left-4 bg-gr20 px-1"
                  for="new_password"
                  >New Password</label
                >
                <input
                  class="w-full rounded-[8px] px-4 py-3 text-gr80 placeholder:text-gr80 pr-12"
                  type="password"
                  id="new_password"
                  placeholder="*******************" />
                <button
                  type="button"
                  id="toggleNewPassword"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-gr60 z-[10]"
                  tabindex="-1">
                  <i
                    id="newPasswordIcon"
                    class="hgi hgi-stroke hgi-view-off text-nt30 text-2xl"></i>
                </button>
              </div>
              <div class="relative mb-5">
                <input
                  class="w-full rounded-[8px] px-4 py-3 text-gr80 placeholder:text-gr50 pr-12"
                  type="password"
                  id="conform_password"
                  placeholder="Confirm Password" />
                <button
                  type="button"
                  id="toggleConformPassword"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-gr60 z-[10]"
                  tabindex="-1">
                  <i
                    id="conformPasswordIcon"
                    class="hgi hgi-stroke hgi-view text-nt30 text-2xl"></i>
                </button>
              </div>
              <div class="mb-6">
                <div class="flex items-center gap-2 mb-3">
                  <span class="d-center"
                    ><i
                      class="hgi hgi-stroke hgi-checkmark-badge-01 text-xl text-primary"></i
                  ></span>
                  <span class="text-sm text-gr60 block"
                    >Must be at least 8 characters</span
                  >
                </div>
                <div class="flex items-center gap-2">
                  <span class="d-center"
                    ><i
                      class="hgi hgi-stroke hgi-checkmark-badge-01 text-xl text-primary"></i
                  ></span>
                  <span class="text-sm text-gr60 block"
                    >Must contain one special character</span
                  >
                </div>
              </div>
              <div
                class="w-full px-6 py-3 rounded-[8px] bg-primary hover:bg-p20 duration-300">
                <a href="successfully_password_reset.html" type="submit" class="text-nt10 font-bold w-full text-center block">
                  Save Passwords
                </a>
              </div>
            </form>
            <div>
              <a
                class="flex items-center justify-center gap-2"
                href="login.html">
                <span class="d-center"><i class="hgi hgi-stroke hgi-arrow-left-02"></i></span>
                <span class="font-bold text-gr80">Back to Login</span></a
              >
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
