<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  </head>

  <body class="relative min-h-screen">
    <div class="mx-auto max-w-md">
      <!-- Time and Network bar starts -->
      <div class="mx-auto max-w-md">
        <div class="container">
          <div class="flex justify-between items-center py-2">
            <img
              class="w-full"
              src="assets/images/statusbar.png"
              alt=""
              draggable="false" />
          </div>
        </div>
      </div>
      <!-- Time and Network bar ends -->
      <div class="mx-auto max-w-md my-[-1px] border-b pb-4 border-gr30">
        <div class="container">
          <div class="px-4 flex items-center justify-between">
            <a href="javascript:void(0)" class="flex items-center gap-3">
              <span class="d-center"
                ><i
                  class="hgi hgi-stroke hgi-arrow-left-01 text-2xl text-gr80"></i
              ></span>
              <span class="font-bold text-lg text-gr80">Settings</span>
            </a>
          </div>
        </div>
      </div>
      <!-- Search area Starts -->
    </div>
    <!-- account features list starts -->
    <section class="mx-auto max-w-md px-4 pt-4 notisettings">
      <div>
        <div class="flexb pt-2 pr-2 pb-3 border-b border-gr30 mb-4">
          <span class="font-semibold text-gr80">Allow Notifications</span>
          <div>
            <label class="switchSmall2 m5">
              <input type="checkbox" checked="" />
              <small></small>
            </label>
          </div>
        </div>
        <div class="flexb pt-2 pr-2 pb-3 border-b border-gr30 mb-4">
          <span class="font-semibold text-gr80">Discount Notifications</span>
          <div>
            <label class="switchSmall2 m5">
              <input type="checkbox" checked="" />
              <small></small>
            </label>
          </div>
        </div>
        <div class="flexb pt-2 pr-2 pb-3 border-b border-gr30 mb-4">
          <span class="font-semibold text-gr80">Sound Notifications</span>
          <div>
            <label class="switchSmall2 m5">
              <input type="checkbox" checked="" />
              <small></small>
            </label>
          </div>
        </div>
        <div class="flexb pt-2 pr-2 pb-3 border-b border-gr30 mb-4">
          <span class="font-semibold text-gr80">Exclusive Discounts</span>
          <div>
            <label class="switchSmall2 m5">
              <input type="checkbox" checked="" />
              <small></small>
            </label>
          </div>
        </div>
        <div class="flexb pt-2 pr-2 pb-3 border-b border-gr30 mb-4">
          <span class="font-semibold text-gr80">System Notifications</span>
          <div>
            <label class="switchSmall2 m5">
              <input type="checkbox" checked="" />
              <small></small>
            </label>
          </div>
        </div>
        <div class="flexb pt-2 pr-2 pb-3 border-b border-gr30 mb-4">
          <span class="font-semibold text-gr80">Location Notifications</span>
          <div>
            <label class="switchSmall2 m5">
              <input type="checkbox" checked="" />
              <small></small>
            </label>
          </div>
        </div>
        <div class="flexb pt-2 pr-2 pb-3 border-b border-gr30 mb-4">
          <div>
            <span class="font-semibold text-gr80 mb-1"
              >Payment Notifications</span
            >
            <p class="text-gr60 text-sm">Payment Failure Notifications</p>
          </div>
          <div>
            <label class="switchSmall2 m5">
              <input type="checkbox" checked="" />
              <small></small>
            </label>
          </div>
        </div>
      </div>
    </section>
    <!-- account features list ends -->

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
