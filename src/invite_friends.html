<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  </head>

  <body class="relative min-h-screen">
    <!-- Time and Network bar starts -->
    <div class="mx-auto max-w-md">
      <div class="container">
        <div class="flex justify-between items-center py-2">
          <img
            class="w-full"
            src="assets/images/statusbar.png"
            alt=""
            draggable="false" />
        </div>
      </div>
    </div>
    <!-- Time and Network bar ends -->
    <section class="mx-auto max-w-md mb-[144px]">
      <div class="container">
        <div
          class="p-4 flex items-center justify-between border-b border-gr30 mb-4">
          <a href="index.html" class="flex items-center gap-3">
            <span class="d-center"
              ><i class="hgi hgi-stroke hgi-arrow-left-01 text-2xl"></i
            ></span>
            <span class="fs-six text-gr80 font-bold">Payment Method</span>
          </a>
        </div>
      </div>
    </section>
    <section class="mx-auto max-w-md px-4">
      <div>
        <div class="mb-4">
          <img class="mx-auto" src="assets/images/invite_friends.png" alt="" />
        </div>
        <div class="px-4">
          <h6 class="font-bold text-gr80 text-center mb-[6px]">
            $50 Reward by Inviting a Friend!
          </h6>
          <p class="text-gr60 text-center mb-4">
            Share the joy—refer your friends and get rewarded when they join!
          </p>
          <div class="flexb gap-3 px-7">
            <a
              href="javascript:void(0)"
              class="size-12 border border-gr30 rounded-lg d-center">
              <i class="hgi hgi-stroke hgi-messenger text-gr80 text-2xl"></i>
            </a>
            <a
              href="javascript:void(0)"
              class="size-12 border border-gr30 rounded-lg d-center">
              <i class="hgi hgi-stroke hgi-whatsapp text-gr80 text-2xl"></i>
            </a>
            <a
              href="javascript:void(0)"
              class="size-12 border border-gr30 rounded-lg d-center">
              <i class="hgi hgi-stroke hgi-instagram text-gr80 text-2xl"></i>
            </a>
            <a
              href="javascript:void(0)"
              class="size-12 border border-gr30 rounded-lg d-center">
              <i class="hgi hgi-stroke hgi-linkedin-01 text-gr80 text-2xl"></i>
            </a>
            <a
              href="javascript:void(0)"
              class="size-12 border border-gr30 rounded-lg d-center">
              <i class="hgi hgi-stroke hgi-pinterest text-gr80 text-2xl"></i>
            </a>
          </div>
        </div>
      </div>
    </section>

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
