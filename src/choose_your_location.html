<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  </head>

  <body>
    <!-- Time and Network bar starts -->
    <div class="mx-auto max-w-md">
      <div class="container">
        <div class="flex justify-between items-center py-2">
          <img
            class="w-full"
            src="assets/images/statusbar.png"
            alt=""
            draggable="false" />
        </div>
      </div>
    </div>
    <!-- Time and Network bar ends -->
    <section class="mx-auto max-w-md">
      <div class="container">
        <div class="p-4 flex items-center border-b border-gr30 mb-9">
          <a href="index.html" class="flex items-center gap-3">
            <span class="d-center"
              ><i class="hgi hgi-stroke hgi-arrow-left-01 text-2xl"></i
            ></span>
            <span class="fs-six text-gr80 font-bold">Choose your location</span>
          </a>
        </div>
        <div>
          <div class="mb-6">
            <img
              class="mx-auto"
              src="assets/images/chooseyourlocation.png"
              alt="" />
          </div>
          <form>
            <div class="px-4">
              <div
                class="flex items-center border border-gr30 px-4 py-3 gap-2 rounded-lg mb-[240px]">
                <span class="d-center"
                  ><i
                    class="hgi hgi-stroke hgi-maps-global-01 text-xl text-gr60"></i
                ></span>
                <input
                  type="text"
                  placeholder="Your Location"
                  class="w-full text-gr60 !border-0 !p-0" />
                <span class="d-center cursor-pointer"
                  ><i
                    class="hgi hgi-stroke hgi-cursor-pointer-02 text-xl text-gr60"></i
                ></span>
              </div>
            </div>
            <div class="p-4 border-0.5 border-t border-gr30">
              <div
                class="w-full px-6 py-3 rounded-[8px] duration-300 border border-gr30 mb-4">
                <a href="choose_your_location.html" class="text-gr70 font-bold w-full text-center block">
                  Choose another location
                </a>
              </div>
              <div
                class="w-full px-6 py-3 rounded-[8px] bg-primary hover:bg-p20 duration-300">
                <a href="index.html" class="text-nt10 font-bold w-full text-center block">
                  Done
                </a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </section>

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
