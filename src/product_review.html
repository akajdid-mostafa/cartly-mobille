<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  </head>

  <body class="relative min-h-screen">
    <!-- Time and Network bar starts -->
    <div class="mx-auto max-w-md">
      <div class="container">
        <div class="flex justify-between items-center py-2">
          <img
            class="w-full"
            src="assets/images/statusbar.png"
            alt=""
            draggable="false" />
        </div>
      </div>
    </div>
    <!-- Time and Network bar ends -->
    <section class="mx-auto max-w-md mb-4">
      <div class="container">
        <div class="p-4 flex items-center justify-between border-b border-gr30">
          <a href="index.html" class="flex items-center gap-3">
            <span class="d-center"
              ><i class="hgi hgi-stroke hgi-arrow-left-01 text-2xl"></i
            ></span>
            <span class="fs-six text-gr80 font-bold">Product Review</span>
          </a>
        </div>
      </div>
    </section>
    <!-- Products Delete Starts -->
    <section class="mx-auto max-w-md">
      <form>
        <div class="px-4">
          <div class="border border-gr30 rounded-xl p-4">
            <div class="border-b border-gr30 pb-4 mb-4">
              <span class="font-semibold text-gr80 mb-3"
                >How is your product ?
              </span>
              <div>
                <div class="flex items-center gap-3 mb-4">
                  <div class="h-[74px] w-[74px]">
                    <img
                      class="rounded-lg"
                      src="assets/images/woman-6.png"
                      alt="" />
                  </div>
                  <div>
                    <div class="mb-[6px]">
                      <h6 class="text-sm text-gr80 font-bold mb-[6px]">
                        Serene Meadow Sundress
                      </h6>
                      <span class="text-[12px] text-gr60">UX Store</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="text-sm font-bold text-primary">$28.56</span>
                      <span class="text-sm text-gr60 line-through">$29.56</span>
                    </div>
                  </div>
                </div>
                <div class="flex items-center gap-3 mb-4">
                  <div class="h-[74px] w-[74px]">
                    <img
                      class="rounded-lg"
                      src="assets/images/woman-7.png"
                      alt="" />
                  </div>
                  <div>
                    <div class="mb-[6px]">
                      <h6 class="text-sm text-gr80 font-bold mb-[6px]">
                        Aurora Wrap Dress
                      </h6>
                      <span class="text-[12px] text-gr60">UX Store</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="text-sm font-bold text-primary">$28.56</span>
                      <span class="text-sm text-gr60 line-through">$29.56</span>
                    </div>
                  </div>
                </div>
                <div class="flex items-center gap-3">
                  <div class="h-[74px] w-[74px]">
                    <img
                      class="rounded-lg"
                      src="assets/images/woman-8.png"
                      alt="" />
                  </div>
                  <div>
                    <div class="mb-[6px]">
                      <h6 class="text-sm text-gr80 font-bold mb-[6px]">
                        Bella Ruffle Mini
                      </h6>
                      <span class="text-[12px] text-gr60">UX Store</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="text-sm font-bold text-primary">$28.56</span>
                      <span class="text-sm text-gr60 line-through">$29.56</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div>
              <div class="border-b border-gr30 pb-4 mb-4">
                <span class="font-semibold text-gr80 mb-2"
                  >Overall Ratings</span
                >
                <div class="flex justify-start items-center gap-1">
                  <i
                    class="hgi hgi-stroke hgi-star text-xl font-bold text-gr40"></i>
                  <i
                    class="hgi hgi-stroke hgi-star text-xl font-bold text-gr40"></i>
                  <i
                    class="hgi hgi-stroke hgi-star text-xl font-bold text-gr40"></i>
                  <i
                    class="hgi hgi-stroke hgi-star text-xl font-bold text-gr40"></i>
                  <i
                    class="hgi hgi-stroke hgi-star text-xl font-bold text-gr40"></i>
                </div>
              </div>
              <div>
                <span class="font-semibold text-gr80 mb-3">Review Details</span>
                <textarea
                  cols="10"
                  rows="5"
                  placeholder="Write a Review"
                  class="w-full p-4 !border !border-gr30 rounded-lg mb-2"></textarea>
                <button class="flex items-center gap-2">
                  <span class="d-center">
                    <i class="hgi hgi-stroke hgi-camera-01 text-2xl"></i>
                  </span>
                  <span class="text-gr80 text-sm">Add Photos</span>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="p-4 mt-5 border-t border-gr30">
          <button
            type="submit"
            class="font-bold text-nt10 py-3 w-full rounded-lg bg-primary">
            Submit
          </button>
        </div>
      </form>
    </section>
    <!-- Products Delete  Ends -->

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
