<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>

  <body class="relative min-h-screen">

              </button>
            </div>
            <ul>
              <li>
                <button
                  class="colorbtns flex items-center justify-between w-full text-left py-3 !border-b !border-gr30 filter-option"
                  data-filter="color">
                  <span class="flex items-center gap-2">
                    <img src="assets/images/audienceimg1.png" alt="" />
