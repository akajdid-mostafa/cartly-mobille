<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  </head>

  <body>
    <!-- Time and Network bar starts -->
    <div class="mx-auto max-w-md pb-14">
      <div class="container">
        <div class="flex justify-between items-center py-2">
          <img
            class="w-full"
            src="assets/images/statusbar.png"
            alt=""
            draggable="false" />
        </div>
      </div>
    </div>
    <!-- Time and Network bar ends -->
    <section class="mx-auto max-w-md">
      <div class="container">
        <div>
          <div class="mb-6">
            <img class="mx-auto" src="assets/images/forget-verify.png" alt="" />
          </div>
          <div class="mb-8 text-center">
            <h5 class="mb-2 text-gr80 font-bold">Check your email</h5>
            <p class="text-gr60">We sent a verification link to</p>
            <span class="text-gr60">smith@example.com</span>
          </div>
          <div class="px-4">
            <form>
              <div class="flex items-center justify-center gap-3 mb-8">
                <div class="size-[56px]">
                  <input
                    type="number"
                    class="size-[56px] text-gr50 rounded-lg border border-[rgba(145,158,171,0.32)] placeholder:text-gr50"
                    placeholder="0"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    required />
                </div>
                <div class="size-[56px]">
                  <input
                    type="number"
                    class="size-[56px] text-gr50 rounded-lg border border-[rgba(145,158,171,0.32)] placeholder:text-gr50"
                    placeholder="0"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    required />
                </div>
                <div class="size-[56px]">
                  <input
                    type="number"
                    class="size-[56px] text-gr50 rounded-lg border border-[rgba(145,158,171,0.32)] placeholder:text-gr50"
                    placeholder="0"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    required />
                </div>
                <div class="size-[56px]">
                  <input
                    type="number"
                    class="size-[56px] text-gr50 rounded-lg border border-[rgba(145,158,171,0.32)] placeholder:text-gr50"
                    placeholder="0"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    required />
                </div>
              </div>
              <div
                class="w-full px-6 py-3 rounded-[8px] bg-primary hover:bg-p20 duration-300 mb-8">
                <a href="new_password.html" type="button" class="text-nt10 font-bold w-full text-center block">
                  Verify email
                </a>
              </div>
            </form>
            <div class="flex items-center justify-center gap-4 mb-8">
              <span class="text-gr60">Didn’t receive the email?</span>
              <a class="font-bold text-primary" href="javascript:void(0)"
                >Click to Resend</a
              >
            </div>
            <div class="mb-9">
              <a
                class="flex items-center justify-center gap-2"
                href="login.html">
                <span class="d-center"><i class="hgi hgi-stroke hgi-arrow-left-02"></i></span>
                <span class="font-bold text-gr80">Back to Login</span></a
              >
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
