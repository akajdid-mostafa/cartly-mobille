<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  </head>

  <body>
    <!-- Time and Network bar starts -->
    <div class="mx-auto max-w-md">
      <div class="container">
        <div class="flex justify-between items-center py-2">
          <img
            class="w-full"
            src="assets/images/statusbar.png"
            alt=""
            draggable="false" />
        </div>
      </div>
    </div>
    <!-- Time and Network bar ends -->

    <section class="mx-auto max-w-md">
      <div class="container">
        <div class="p-4 flex items-center border-b border-gr30 mb-10">
          <a href="sign_viaphone.html" class="flex items-center gap-3">
            <span class="d-center"
              ><i class="hgi hgi-stroke hgi-arrow-left-01 text-2xl"></i
            ></span>
            <span class="fs-six text-gr80 font-bold">Verifications</span>
          </a>
        </div>
        <div>
          <div class="px-4">
            <form class="py-6 px-3 rounded-xl border border-gr30 mb-4">
              <div class="mb-8">
                <span class="text-gr80"
                  >Enter the verification code sent via</span
                >
                <span class="text-primary">(+1) 123 456 789</span>
              </div>
              <div class="flex items-center justify-between gap-3 mb-8">
                <div class="size-[56px]">
                  <input
                    type="number"
                    class="size-[56px] text-gr50 rounded-lg border border-[rgba(145,158,171,0.32)] placeholder:text-gr50"
                    placeholder="0"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    required />
                </div>
                <div class="size-[56px]">
                  <input
                    type="number"
                    class="size-[56px] text-gr50 rounded-lg border border-[rgba(145,158,171,0.32)] placeholder:text-gr50"
                    placeholder="0"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    required />
                </div>
                <div class="size-[56px]">
                  <input
                    type="number"
                    class="size-[56px] text-gr50 rounded-lg border border-[rgba(145,158,171,0.32)] placeholder:text-gr50"
                    placeholder="0"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    required />
                </div>
                <div class="size-[56px]">
                  <input
                    type="number"
                    class="size-[56px] text-gr50 rounded-lg border border-[rgba(145,158,171,0.32)] placeholder:text-gr50"
                    placeholder="0"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    required />
                </div>
              </div>
              <div
                class="w-full px-6 py-3 rounded-[8px] bg-primary hover:bg-p20 duration-300 mb-4">
                <a href="signup.html" class="text-nt10 font-bold w-full text-center block">
                  Continue
                </a>
              </div>
            </form>
            <div class="text-center">
              <span class="text-sm text-gr60 mb-3"
                >Request a new verification code 1:38</span
              >
              <a
                href="javascript:void(0)"
                class="text-primary underline text-sm"
                >Resend verification code?</a
              >
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
