<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  </head>

  <body class="relative min-h-screen">
    <section class="mx-auto max-w-md px-4 py-6">
      <div class="fixed inset-0 z-50 bg-black/40 flex items-end justify-center">
        <div
          class="bg-white w-full max-w-md rounded-t-2xl p-0 animate-slideUp py-6">
          <div class="tab-content p-4">
            <div
              class="flex items-center justify-between pb-4 border-b border-gr30">
              <span class="text-lg font-bold">Order Return & Refund</span>
              <button class="d-center">
                <i class="hgi hgi-stroke hgi-cancel-01 text-2xl text-gr60"></i>
              </button>
            </div>
            <ul>
              <li>
                <label
                  class="flex items-center gap-3 py-3 border-b border-gr30 mb-4">
                  <input type="checkbox" class="mb-1 !size-[14px]" />
                  <span class="text-left block text-gr80">Change of mind.</span>
                </label>
              </li>
              <li>
                <label
                  class="flex items-center gap-3 py-3 border-b border-gr30 mb-4">
                  <input type="checkbox" class="mb-1 !size-[14px]" />
                  <span class="text-left block text-gr80"
                    >Found a better price elsewhere.</span
                  >
                </label>
              </li>
              <li>
                <label
                  class="flex items-center gap-3 py-3 border-b border-gr30 mb-4">
                  <input type="checkbox" class="mb-1 !size-[14px]" />
                  <span class="text-left block text-gr80"
                    >Poor customer reviews or feedback.</span
                  >
                </label>
              </li>
              <li>
                <label
                  class="flex items-center gap-3 py-3 border-b border-gr30 mb-4">
                  <input type="checkbox" class="mb-1 !size-[14px]" />
                  <span class="text-left block text-gr80"
                    >Incorrect item ordered.</span
                  >
                </label>
              </li>
              <li>
                <label
                  class="flex items-center gap-3 py-3 border-b border-gr30 mb-4">
                  <input type="checkbox" class="mb-1 !size-[14px]" />
                  <span class="text-left block text-gr80"
                    >Concern about product quality.</span
                  >
                </label>
              </li>
            </ul>
          </div>
          <div class="w-full px-4">
            <a
              href="javascript:void(0)"
              class="!w-full py-3 font-bold bg-warning block text-base px-6 rounded-lg text-nt10 text-center"
              >Confirm</a
            >
          </div>
        </div>
      </div>
    </section>
    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
