<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  <link href="assets/css/index.css" rel="stylesheet"></head>

  <body class="relative min-h-screen">
    <section class="mx-auto max-w-md px-4 py-6">
      <div class="fixed inset-0 z-50 bg-black/40 flex items-end justify-center">
        <div
          class="bg-white w-full max-w-md rounded-t-2xl p-0 animate-slideUp py-6">
          <div class="tab-content p-4">
            <div
              class="flex items-center justify-between pb-4 mb-4 border-b border-gr30">
              <span class="text-lg font-bold">Share with</span>
              <button class="d-center">
                <i class="hgi hgi-stroke hgi-cancel-01 text-2xl text-gr60"></i>
              </button>
            </div>
            <div class="px-4">
              <p class="text-gr60 text-center mb-4">
                Share the joy—refer your friends and get rewarded when they
                join!
              </p>
              <div class="flexb gap-3 px-7">
                <a
                  href="javascript:void(0)"
                  class="size-12 border border-gr30 rounded-lg d-center">
                  <i
                    class="hgi hgi-stroke hgi-messenger text-gr80 text-2xl"></i>
                </a>
                <a
                  href="javascript:void(0)"
                  class="size-12 border border-gr30 rounded-lg d-center">
                  <i class="hgi hgi-stroke hgi-whatsapp text-gr80 text-2xl"></i>
                </a>
                <a
                  href="javascript:void(0)"
                  class="size-12 border border-gr30 rounded-lg d-center">
                  <i
                    class="hgi hgi-stroke hgi-instagram text-gr80 text-2xl"></i>
                </a>
                <a
                  href="javascript:void(0)"
                  class="size-12 border border-gr30 rounded-lg d-center">
                  <i
                    class="hgi hgi-stroke hgi-linkedin-01 text-gr80 text-2xl"></i>
                </a>
                <a
                  href="javascript:void(0)"
                  class="size-12 border border-gr30 rounded-lg d-center">
                  <i
                    class="hgi hgi-stroke hgi-pinterest text-gr80 text-2xl"></i>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  <script defer src="index.js"></script></body>
</html>
