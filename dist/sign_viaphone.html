<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  <link href="assets/css/index.css" rel="stylesheet"></head>

  <body>
    <!-- Time and Network bar starts -->
    <div class="mx-auto max-w-md">
      <div class="container">
        <div class="flex justify-between items-center py-2">
          <img
            class="w-full"
            src="assets/images/statusbar.png"
            alt=""
            draggable="false" />
        </div>
      </div>
    </div>
    <!-- Time and Network bar ends -->

    <section class="mx-auto max-w-md">
      <div class="container">
        <div class="p-4 flex items-center border-b border-gr30 mb-10">
          <a href="signup.html" class="flex items-center gap-3">
            <span class="d-center"
              ><i class="hgi hgi-stroke hgi-arrow-left-01 text-2xl"></i
            ></span>
            <span class="fs-six text-gr80 font-bold">Sign in</span>
          </a>
        </div>
        <div>
          <div class="mb-6">
            <img
              class="mx-auto"
              src="assets/images/signinviaphone.png"
              alt="" />
          </div>
          <div class="px-4">
            <form class="py-6 px-3 rounded-xl border border-gr30">
              <div class="relative mb-6">
                <label
                  class="block text-gray text-[12px] absolute top-[-13px] left-4 bg-gr20 px-1"
                  for="email"
                  >Phone Number</label
                >
                <input
                  class="w-full rounded-[8px] px-4 py-3 text-gr80 placeholder:text-gr80 !ps-10"
                  type="phone"
                  id="phone"
                  placeholder="+8801721666763" />
                <span class="absolute left-3 top-1/2 transform -translate-y-1/2"
                  ><i class="hgi hgi-stroke hgi-circle text-2xl"></i
                ></span>
              </div>
              <div
                class="w-full px-6 py-3 rounded-[8px] bg-primary hover:bg-p20 duration-300 mb-4">
                <a href="verification.html" class="text-nt10 font-bold w-full text-center block">
                  Continue
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  <script defer src="index.js"></script></body>
</html>
