<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  <link href="assets/css/index.css" rel="stylesheet"></head>

  <body class="relative min-h-screen">
    <main class="liveshoppingstyle4 mx-auto max-w-md">
      <!-- Time and Network bar starts -->
      <div class="mx-auto max-w-md">
        <div class="container">
          <div class="flex justify-between items-center py-2">
            <img
              class="w-full"
              src="assets/images/statusbar.png"
              alt=""
              draggable="false" />
          </div>
        </div>
      </div>
      <div class="px-4 flex items-center justify-between gap-2 mb-[350px]">
        <div class="flex items-center gap-4">
          <img
            class="rounded-full size-10"
            src="assets/images/sellerlogo5.png"
            alt="" />
          <a href="seller_profile.html">
            <span class="text-sm font-bold text-gr80 cursor-pointer"
              >Pumma Shop</span
            >
            <span class="text-xs text-gr60">Just be your self</span>
          </a>
        </div>
        <div class="flex items-center gap-2">
          <div class="flex items-center gap-2">
            <i class="hgi hgi-stroke hgi-view text-xl text-nt10"></i>
            <span class="text-xs text-nt10">1.5K</span>
          </div>
          <span
            class="text-xs text-nt10 px-2 py-1 bg-error rounded-full inline-block"
            >Live</span
          >
        </div>
      </div>
      <div class="px-4 pb-6">
        <div class="flex items-end">
          <div class="w-3/4">
            <div
              class="flex items-start gap-1 p-2 rounded-xl bg-[rgba(145,158,171,0.08)] w-1/2 mb-1">
              <img
                class="size-6"
                src="assets/images/liveshoppins1.png"
                alt="" />
              <div>
                <span class="text-xs text-nt10 cursor-pointer">Devon Lane</span>
                <span class="text-[10px] text-nt10">Just be your self</span>
              </div>
            </div>
            <div
              class="flex items-start gap-1 p-2 rounded-xl bg-[rgba(145,158,171,0.08)] w-1/2 mb-1">
              <img
                class="size-6"
                src="assets/images/liveshoppins2.png"
                alt="" />
              <div>
                <span class="text-xs text-nt10 cursor-pointer">Lora Andy</span>
                <span class="text-[10px] text-nt10"
                  >How about your yesterday product ?</span
                >
              </div>
            </div>
            <div
              class="flex items-start gap-1 p-2 rounded-xl bg-[rgba(145,158,171,0.08)] w-1/2 mb-1">
              <img
                class="size-6"
                src="assets/images/liveshoppins3.png"
                alt="" />
              <div>
                <span class="text-xs text-nt10 cursor-pointer"
                  >Guy Hawkins</span
                >
                <span class="text-[10px] text-nt10"
                  >Hello, I need black one
                </span>
              </div>
            </div>
            <div
              class="flex items-start gap-1 p-2 rounded-xl bg-[rgba(145,158,171,0.08)] w-1/2 mb-[14px]">
              <img
                class="size-6"
                src="assets/images/liveshoppins4.png"
                alt="" />
              <div>
                <span class="text-xs text-nt10 cursor-pointer"
                  >Jenny Wilson</span
                >
                <span class="text-[10px] text-nt10"
                  >Hello, I need black one
                </span>
              </div>
            </div>
          </div>
          <div class="relative w-[110px]">
            <a href="live_shopping2.html">
              <img class="1/4" src="assets/images/liveminibg.png" alt="" />
            </a>
            <div class="absolute bottom-2 left-0 px-2">
              <span class="text-xs mb-1 text-nt10">Sports suite style</span>
              <div class="flex items-center gap-[2px] mb-2">
                <span class="d-center"
                  ><i class="hgi hgi-stroke hgi-thumbs-up text-nt10 text-sm"></i
                ></span>
                <span class="text-[10px] text-nt10">5 Item Sold</span>
              </div>
              <button
                class="bg-primary !py-1 px-4 rounded-[6px] text-nt10 w-full text-xs">
                $31.50
              </button>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-[10px] py-[10px]">
          <div
            class="flex items-center py-[6px] px-[14px] bg-nt10 border border-[#919EAB52] rounded-full">
            <input
              type="text"
              class="!border-0 !p-0"
              placeholder="Let’s talk something" />
            <span class="cursor-pointer d-center"
              ><i class="hgi hgi-stroke hgi-smile text-2xl text-gr60"></i
            ></span>
          </div>
          <button class="size-[40px] bg-nt10 rounded-full w-[50px] d-center">
            <i class="hgi hgi-stroke hgi-thumbs-up text-xl"></i>
          </button>
          <button class="size-[40px] bg-nt10 rounded-full w-[50px] d-center">
            <i class="hgi hgi-stroke hgi-comment-01 text-xl"></i>
          </button>
          <a href="cart_style.html" class="size-[40px] bg-nt10 rounded-full relative w-[50px] d-center">
            <i class="hgi hgi-stroke hgi-shopping-cart-02 text-xl"></i>
            <span
              class="size-4 bg-primary rounded-full text-[10px] text-nt10 absolute top-1/6 left-3/6 d-center"
              >5</span
            >
          </a>
        </div>
      </div>
    </main>

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  <script defer src="index.js"></script></body>
</html>
