<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  <link href="assets/css/index.css" rel="stylesheet"></head>

  <body class="relative min-h-screen">
    <div class="mx-auto max-w-md">
      <!-- Time and Network bar starts -->
      <div class="mx-auto max-w-md">
        <div class="container">
          <div class="flex justify-between items-center py-2">
            <img
              class="w-full"
              src="assets/images/statusbar.png"
              alt=""
              draggable="false" />
          </div>
        </div>
      </div>
      <!-- Time and Network bar ends -->
      <div class="mx-auto max-w-md my-[-1px] mb-4">
        <div class="container">
          <div
            class="px-4 flex items-center justify-between pb-4 border-b border-gr30">
            <a href="all_screens.html" class="flex items-center gap-3">
              <span class="d-center"
                ><i
                  class="hgi hgi-stroke hgi-arrow-left-01 text-2xl text-gr80"></i
              ></span>
              <span class="font-bold text-lg text-gr80">Checkout Screens</span>
            </a>
          </div>
        </div>
      </div>
      <!-- Search area Starts -->
    </div>
    <!-- account features list starts -->
    <section class="mx-auto max-w-md px-4 pt-4 mb-12">
      <div class="flexb gap-3 pb-3 border-b border-gr30 mb-3">
        <a href="cart_style.html" class="flexs text-gr80 gap-4">
          <span class="d-center"
            ><i class="hgi hgi-stroke hgi-note text-2xl text-gr80"></i
          ></span>
          <span class="text-gr80">Cart Style 01</span>
        </a>
        <a href="cart_style.html" class="d-center pr-3"
          ><i class="hgi hgi-stroke hgi-arrow-right-01 text-2xl text-gr80"></i
        ></a>
      </div>
      <div class="flexb gap-3 pb-3 border-b border-gr30 mb-3">
        <a href="empty_cart.html" class="flexs text-gr80 gap-4">
          <span class="d-center"
            ><i class="hgi hgi-stroke hgi-note text-2xl text-gr80"></i
          ></span>
          <span class="text-gr80">Empty Cart</span>
        </a>
        <a href="empty_cart.html" class="d-center pr-3"
          ><i class="hgi hgi-stroke hgi-arrow-right-01 text-2xl text-gr80"></i
        ></a>
      </div>
      <div class="flexb gap-3 pb-3 border-b border-gr30 mb-3">
        <a href="payment_method.html" class="flexs text-gr80 gap-4">
          <span class="d-center"
            ><i class="hgi hgi-stroke hgi-note text-2xl text-gr80"></i
          ></span>
          <span class="text-gr80">Payment method</span>
        </a>
        <a href="payment_method.html" class="d-center pr-3"
          ><i class="hgi hgi-stroke hgi-arrow-right-01 text-2xl text-gr80"></i
        ></a>
      </div>
      <div class="flexb gap-3 pb-3 border-b border-gr30 mb-3">
        <a href="add_newcard.html" class="flexs text-gr80 gap-4">
          <span class="d-center"
            ><i class="hgi hgi-stroke hgi-note text-2xl text-gr80"></i
          ></span>
          <span class="text-gr80">Add New Cart</span>
        </a>
        <a href="add_newcard.html" class="d-center pr-3"
          ><i class="hgi hgi-stroke hgi-arrow-right-01 text-2xl text-gr80"></i
        ></a>
      </div>
      <div class="flexb gap-3 pb-3 border-b border-gr30 mb-3">
        <a href="check_out.html" class="flexs text-gr80 gap-4">
          <span class="d-center"
            ><i class="hgi hgi-stroke hgi-note text-2xl text-gr80"></i
          ></span>
          <span class="text-gr80">Checkout</span>
        </a>
        <a href="check_out.html" class="d-center pr-3"
          ><i class="hgi hgi-stroke hgi-arrow-right-01 text-2xl text-gr80"></i
        ></a>
      </div>
      <div class="flexb gap-3 pb-3 border-b border-gr30 mb-3">
        <a href="order_placed.html" class="flexs text-gr80 gap-4">
          <span class="d-center"
            ><i class="hgi hgi-stroke hgi-note text-2xl text-gr80"></i
          ></span>
          <span class="text-gr80">Order placed</span>
        </a>
        <a href="order_placed.html" class="d-center pr-3"
          ><i class="hgi hgi-stroke hgi-arrow-right-01 text-2xl text-gr80"></i
        ></a>
      </div>
      <div class="flexb gap-3 pb-3 border-b border-gr30 mb-3">
        <a href="tracking.html" class="flexs text-gr80 gap-4">
          <span class="d-center"
            ><i class="hgi hgi-stroke hgi-note text-2xl text-gr80"></i
          ></span>
          <span class="text-gr80">Tracking</span>
        </a>
        <a href="tracking.html" class="d-center pr-3"
          ><i class="hgi hgi-stroke hgi-arrow-right-01 text-2xl text-gr80"></i
        ></a>
      </div>
      <div class="flexb gap-3 pb-3 border-b border-gr30 mb-3">
        <a href="delivery_review.html" class="flexs text-gr80 gap-4">
          <span class="d-center"
            ><i class="hgi hgi-stroke hgi-note text-2xl text-gr80"></i
          ></span>
          <span class="text-gr80">Delivery Review</span>
        </a>
        <a href="delivery_review.html" class="d-center pr-3"
          ><i class="hgi hgi-stroke hgi-arrow-right-01 text-2xl text-gr80"></i
        ></a>
      </div>
      <div class="flexb gap-3 pb-3 border-b border-gr30 mb-3">
        <a href="product_review.html" class="flexs text-gr80 gap-4">
          <span class="d-center"
            ><i class="hgi hgi-stroke hgi-note text-2xl text-gr80"></i
          ></span>
          <span class="text-gr80">Product Review</span>
        </a>
        <a href="product_review.html" class="d-center pr-3"
          ><i class="hgi hgi-stroke hgi-arrow-right-01 text-2xl text-gr80"></i
        ></a>
      </div>
      <div class="flexb gap-3 pb-3 border-b border-gr30 mb-3">
        <a href="notifications.html" class="flexs text-gr80 gap-4">
          <span class="d-center"
            ><i class="hgi hgi-stroke hgi-note text-2xl text-gr80"></i
          ></span>
          <span class="text-gr80">Notification</span>
        </a>
        <a href="notifications.html" class="d-center pr-3"
          ><i class="hgi hgi-stroke hgi-arrow-right-01 text-2xl text-gr80"></i
        ></a>
      </div>
    </section>
    <!-- account features list ends -->

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  <script defer src="index.js"></script></body>
</html>
