<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  </head>

  <body>
    <!-- Time and Network bar starts -->
    <div class="mx-auto max-w-md mb-[150px]">
      <div class="container">
        <div class="flex justify-between items-center py-2">
          <img
            class="w-full"
            src="assets/images/statusbar.png"
            alt=""
            draggable="false" />
        </div>
      </div>
    </div>
    <!-- Time and Network bar ends -->
    <section class="mx-auto max-w-md">
      <div class="container">
        <div>
          <div class="mb-6">
            <img
              class="mx-auto"
              src="assets/images/twosetp-verification.png"
              alt="" />
          </div>
          <div class="mb-[160px] text-center">
            <h5 class="mb-3 text-gr80 font-bold">We're now using this</h5>
            <h5 class="mb-3 text-gr80 font-bold">
              app for two-step verification.
            </h5>
            <p class="text-gr60">
              You can now verify your identity with this <br />
              app—more secure and works over Wi-Fi <br />
              even without signal.
            </p>
          </div>
          <div class="p-4 border-0.5 border-t border-gr30">
            <div
              class="w-full px-6 py-3 rounded-[8px] bg-primary hover:bg-p20 duration-300">
              <a href="setup_biometric.html" class="text-nt10 font-bold w-full text-center block">
                Enable Two Step Verifications
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
