<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  </head>

  <body class="relative min-h-screen">
    <section class="mx-auto max-w-md px-4 py-6">
      <div class="fixed inset-0 z-50 bg-black/40 flex items-end justify-center">
        <div class="w-full max-w-md rounded-t-2xl p-0 animate-slideUp py-6">
          <a
            href="index.html"
            class="d-center mx-auto bg-white size-11 rounded-full mb-6 block">
            <i class="hgi hgi-stroke hgi-cancel-01 text-2xl text-gr60"></i>
          </a>
          <div class="tab-content p-4 bg-white pb-6 rounded-t-2xl">
            <div class="mb-4">
              <img class="mx-auto" src="assets/images/logout1.png" alt="" />
            </div>
            <div class="mb-6">
              <span
                class="block text-center text-lg font-bold text-gr80 mb-[6px]"
                >Logout ?</span
              >
              <p class="text-center text-gr60">
                Are you sure you want to logout <br />
                of your account
              </p>
            </div>
          </div>
          <div class="w-full px-4 bg-white pb-6">
            <a
              href="my_account.html"
              class="!w-full mb-4 py-3 font-bold !border !border-gr30 block text-base px-6 rounded-lg text-gr80 text-center">
              Keep It
            </a>
            <a
              href="index.html"
              class="!w-full py-3 font-bold bg-error block text-base px-6 rounded-lg text-nt10 text-center"
              >Confirmed Logout</a
            >
          </div>
        </div>
      </div>
    </section>
    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
