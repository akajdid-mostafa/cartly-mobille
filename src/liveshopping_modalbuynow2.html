<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  </head>

  <body class="relative min-h-screen">
    <section class="mx-auto max-w-md px-4 py-6">
      <div class="fixed inset-0 z-50 bg-black/40 flex items-end justify-center">
        <div
          class="bg-white w-full max-w-md rounded-t-2xl p-0 animate-slideUp py-6">
          <div class="tab-content p-4">
            <div
              class="flex items-center justify-between pb-4 mb-4 border-b border-gr30">
              <span class="text-lg font-bold">Buy Now</span>
              <button class="d-center">
                <i class="hgi hgi-stroke hgi-cancel-01 text-2xl text-gr60"></i>
              </button>
            </div>
            <div>
              <div class="border-b border-gr30 pb-3 mb-4">
                <div class="flex items-center gap-3">
                  <span class="d-center"
                    ><i
                      class="hgi hgi-stroke hgi-maps-global-01 text-2xl text-gr80"></i
                  ></span>
                  <span class="text-gr80">Address</span>
                </div>
                <p class="text-sm text-gr60">
                  2464 Royal Ln. Mesa, New Jersey 45463
                </p>
              </div>
              <div class="flexb mb-4">
                <span class="font-semibold text-gr80">Unit Price</span>
                <div class="flexs gap-[6px]">
                  <span class="d-center"
                    ><i
                      class="hgi hgi-stroke hgi-stop-watch text-xl text-error"></i
                  ></span>
                  <span class="text-xs text-error">2 pieces left</span>
                </div>
              </div>
              <div class="flexb mb-4">
                <div class="flex items-center gap-2 mb-2">
                  <span class="font-bold text-gr80">$28.56</span>
                  <span class="text-sm text-gr60 line-through">$29.56</span>
                </div>
                <div
                  class="flex items-center gap-3 border border-[#919eab52] rounded-lg py-[6px] px-3">
                  <button class="d-center">
                    <i
                      class="hgi hgi-stroke hgi-minus-sign-circle text-xl text-gr60"></i>
                  </button>
                  <span class="d-center text-nt30 text-base">1</span>
                  <button class="d-center">
                    <i
                      class="hgi hgi-stroke hgi-plus-sign-circle text-xl text-primary"></i>
                  </button>
                </div>
              </div>
              <div class="mb-4">
                <span class="text-base text-gr80 font-semibold block mb-4"
                  >Select Color</span
                >
                <div class="flex items-center justify-between gap-4">
                  <span
                    class="size-9 rounded-full bg-primary d-center cursor-pointer">
                    <i
                      class="hgi hgi-stroke hgi-tick-01 text-2xl text-white"></i>
                  </span>
                  <span
                    class="size-9 rounded-full bg-red-500 cursor-pointer"></span>
                  <span
                    class="size-9 rounded-full bg-blue-500 cursor-pointer"></span>
                  <span
                    class="size-9 rounded-full bg-green-500 cursor-pointer"></span>
                  <span
                    class="size-9 rounded-full bg-yellow-500 cursor-pointer"></span>
                  <span
                    class="size-9 rounded-full bg-purple-500 cursor-pointer"></span>
                </div>
              </div>
              <div class="mb-4">
                <span class="text-base text-gr80 font-semibold block mb-4"
                  >Select Size</span
                >
                <div class="flex items-center justify-between gap-4">
                  <span
                    class="size-9 rounded-full d-center border border-gr30 cursor-pointer text-sm text-gr80">
                    S
                  </span>
                  <span
                    class="size-9 rounded-full d-center border border-gr30 cursor-pointer text-sm text-gr80">
                    M
                  </span>
                  <span
                    class="size-9 rounded-full d-center border border-gr30 cursor-pointer text-sm text-gr80">
                    L
                  </span>
                  <span
                    class="size-9 rounded-full d-center border border-primary cursor-pointer text-sm text-primary">
                    XL
                  </span>
                  <span
                    class="size-9 rounded-full d-center border border-gr30 cursor-pointer text-sm text-gr80">
                    2XL
                  </span>
                  <span
                    class="size-9 rounded-full d-center border border-gr30 cursor-pointer text-sm text-gr80">
                    3XL
                  </span>
                </div>
              </div>
              <div>
                <a href="payment_method.html"
                  class="bg-primary text-white text-sm font-bold w-full px-4 py-3 rounded-lg text-center block">
                  Pay Now $250
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
