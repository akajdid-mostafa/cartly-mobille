<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  </head>

  <body class="relative min-h-screen">
    <!-- Time and Network bar starts -->
    <div class="mx-auto max-w-md mb-16">
      <div class="container">
        <div class="flex justify-between items-center py-2">
          <img
            class="w-full"
            src="assets/images/statusbar.png"
            alt=""
            draggable="false" />
        </div>
      </div>
    </div>
    <section class="mx-auto max-w-md mb-14 px-4">
      <div class="mb-4">
        <img class="mx-auto" src="assets/images/orderplacedimg.png" alt="" />
      </div>
      <div class="mb-4">
        <h5 class="font-bold text-gr80 text-center mb-2">Cart is Empty</h5>
        <p class="text-gr60 text-center">
          Looks like you haven’t added anything yet—start shopping now!
        </p>
      </div>
      <div class="mb-[70px]">
        <div class="flexs gap-[10px] mb-4">
          <div class="d-center rounded-full border border-gr30 size-12">
            <i class="hgi hgi-stroke hgi-grid text-2xl text-gr80"></i>
          </div>
          <div>
            <span class="text-gr60 text-sm mb-1">Order ID</span>
            <span class="text-gr80 font-bold text-sm">#3456</span>
          </div>
        </div>
        <div class="flexs gap-[10px] mb-4">
          <div class="d-center rounded-full border border-gr30 size-12">
            <i
              class="hgi hgi-stroke hgi-delivery-box-01 text-2xl text-gr80"></i>
          </div>
          <div>
            <span class="text-gr60 text-sm mb-1">Order Item</span>
            <span class="text-gr80 font-bold text-sm">20 Items</span>
          </div>
        </div>
        <div class="flexs gap-[10px]">
          <div class="d-center rounded-full border border-gr30 size-12">
            <i
              class="hgi hgi-stroke hgi-mobile-programming-01 text-2xl text-gr80"></i>
          </div>
          <div>
            <span class="text-gr60 text-sm mb-1"
              >Confirmation will be sent to your App, SMS</span
            >
            <span class="text-gr80 font-bold text-sm"
              >Check your App or Phone SMS</span
            >
          </div>
        </div>
      </div>
    </section>
    <div class="mx-auto max-w-md flexs gap-4 py-4 px-4 mb-6 border-t border-gr30">
      <a href="index.html"
        class="text-sm font-medium text-gr80 !border !border-gr30 py-2.5 px-4 rounded-lg w-full block text-center">
        Back to Home
      </a>
      <a href="tracking.html"
        class="text-sm font-medium text-nt10 bg-primary py-2.5 px-4 rounded-lg w-full block text-center">
        Track Order
      </a>
    </div>

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
