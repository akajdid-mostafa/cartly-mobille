<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon" />
    <title>Cartly - E-Commerce Mobile app HTMl Template</title>
  </head>

  <body class="relative min-h-screen">
    <!-- Time and Network bar starts -->
    <div class="mx-auto max-w-md">
      <div class="container">
        <div class="flex justify-between items-center py-2">
          <img
            class="w-full"
            src="assets/images/statusbar.png"
            alt=""
            draggable="false" />
        </div>
      </div>
    </div>
    <!-- Time and Network bar ends -->
    <section class="mx-auto max-w-md">
      <div class="container">
        <div
          class="p-4 flex items-center justify-between border-b border-gr30 mb-4">
          <a href="index.html" class="flex items-center gap-3">
            <span class="d-center"
              ><i class="hgi hgi-stroke hgi-arrow-left-01 text-2xl"></i
            ></span>
            <span class="fs-six text-gr80 font-bold">Payment Method</span>
          </a>
        </div>
      </div>
    </section>
    <section class="mx-auto max-w-md px-4">
      <h6 class="text-gr80 font-bold mb-4">Cash on delivery</h6>
      <div class="flexb p-4 rounded-xl border border-gr30 mb-4">
        <div class="flexs gap-3">
          <span class="d-center"
            ><i class="hgi hgi-stroke hgi-credit-card text-2xl text-gr80"></i
          ></span>
          <div>
            <span class="text-gr80 font-bold text-sm">Cash</span>
          </div>
        </div>
        <div class="d-center">
          <input type="checkbox" class="!size-[18px]" />
        </div>
      </div>
      <h6 class="text-gr80 font-bold mb-4">Debit & Credit Card</h6>
      <div class="flexb p-4 rounded-xl border border-gr30 mb-4">
        <div class="flexs gap-3">
          <span class="d-center"
            ><i
              class="hgi hgi-stroke hgi-credit-card-accept text-2xl text-gr80"></i
          ></span>
          <div>
            <span class="text-gr80 font-bold text-sm">Add Card</span>
          </div>
        </div>
        <span class="d-center"
          ><i class="hgi hgi-stroke hgi-arrow-right-01 text-2xl text-gr80"></i
        ></span>
      </div>
      <h6 class="text-gr80 font-bold mb-4">More Payment Options</h6>
      <div class="flexb p-4 rounded-xl border border-gr30 mb-4">
        <div class="flexs gap-3">
          <span class="d-center"
            ><i
              class="hgi hgi-stroke hgi-credit-card-accept text-2xl text-gr80"></i
          ></span>
          <div>
            <span class="text-gr80 font-bold text-sm">Google Pay</span>
          </div>
        </div>
        <span class="d-center"
          ><i class="hgi hgi-stroke hgi-arrow-right-01 text-2xl text-gr80"></i
        ></span>
      </div>
      <div class="flexb p-4 rounded-xl border border-gr30 mb-4">
        <div class="flexs gap-3">
          <span class="d-center"
            ><i
              class="hgi hgi-stroke hgi-credit-card-accept text-2xl text-gr80"></i
          ></span>
          <div>
            <span class="text-gr80 font-bold text-sm">Apple Pay</span>
          </div>
        </div>
        <span class="d-center"
          ><i class="hgi hgi-stroke hgi-arrow-right-01 text-2xl text-gr80"></i
        ></span>
      </div>
      <div class="flexb p-4 rounded-xl border border-gr30 mb-[110px]">
        <div class="flexs gap-3">
          <span class="d-center"
            ><i
              class="hgi hgi-stroke hgi-credit-card-accept text-2xl text-gr80"></i
          ></span>
          <div>
            <span class="text-gr80 font-bold text-sm">Paypal</span>
          </div>
        </div>
        <span class="d-center"
          ><i class="hgi hgi-stroke hgi-arrow-right-01 text-2xl text-gr80"></i
        ></span>
      </div>
      <div class="p-4 border-t border-gr30">
        <a href="add_newcard.html" class="font-bold text-nt10 py-3 w-full rounded-lg bg-primary block text-center">
          Confirm Payment
        </a>
      </div>
    </section>

    <script src="./assets/js/plguins.js"></script>
    <script src="./assets/js/plguins-custom.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
